name: Pairing CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pairing-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check index.js
      - name: Pairing security checks
        run: node tests/pairing-static.mjs
      - name: Build hash verification
        run: node build.mjs
